<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>NEO Senior Suite · 인터랙티브 프로토타입</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>/* ─── NEO SENIOR SUITE · Design Tokens (v2 — Toss × 효돌 × Calm) ──── */
:root {
  /* mint — warmer, less saturated than v1 */
  --mint-50:  #ECF8F2;
  --mint-100: #D4F0E3;
  --mint-200: #A8E1C5;
  --mint-300: #6DCB9F;
  --mint-500: #1FA97A;   /* core — slightly warmer */
  --mint-600: #128F66;
  --mint-700: #0C7253;
  --mint-900: #07423A;

  /* surface — Toss-style off-whites for warmth without saturation */
  --bg:       #F6F2EA;   /* page background — warmer than #F1ECE2 */
  --bg-soft:  #FAF7F0;
  --surface:  #FFFFFF;   /* cards */
  --surface-2:#F8F6F1;

  /* grey — increased contrast for hierarchy */
  --gray-0:   #FFFFFF;
  --gray-50:  #F5F4F1;
  --gray-100: #ECEAE4;
  --gray-200: #D9D6CE;
  --gray-300: #BFBBB1;
  --gray-400: #98948B;
  --gray-500: #6E6A62;
  --gray-600: #4A463F;
  --gray-700: #2C2924;
  --gray-900: #15130F;   /* near-black for big titles */

  /* semantic — soft, warm */
  --warn:   #C8843D;
  --warn-bg:#FBF1DF;
  --danger: #B85C5C;
  --danger-bg:#FBEAEA;
  --ok:     var(--mint-600);

  /* warm accents (효돌 따뜻함) */
  --cream:  #FBF6EE;
  --cream-2:#F4EDE0;
  --peach:  #F2C8A6;

  /* type */
  --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
           'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;

  /* radius — slightly bigger, Headspace softness */
  --r-xs: 10px;
  --r-sm: 14px;
  --r-md: 18px;
  --r-lg: 24px;
  --r-pill: 999px;

  /* shadow — much flatter (Toss style) */
  --shadow-sm: 0 1px 2px rgba(20,16,10,.03), 0 2px 4px rgba(20,16,10,.02);
  --shadow-md: 0 2px 8px rgba(20,16,10,.05), 0 1px 2px rgba(20,16,10,.03);
  --shadow-lg: 0 8px 24px rgba(20,16,10,.08), 0 2px 6px rgba(20,16,10,.04);
}

/* base reset inside phone frame */
.app, .app * { box-sizing: border-box; }
.app {
  font-family: var(--font);
  color: var(--gray-900);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
}
.app button { font-family: inherit; cursor: pointer; }

/* scrollbar hidden inside frames */
.app *::-webkit-scrollbar { display: none; }
.app * { scrollbar-width: none; }
</style>
<style>
  html,body{margin:0;padding:0;background:var(--bg);font-family:'Pretendard Variable',system-ui,sans-serif;color:var(--gray-900);min-height:100vh}
  .stage{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:64px 32px;gap:56px;flex-wrap:wrap}
  .left{flex:0 0 360px;width:360px;position:sticky;top:64px}
  .kicker{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--mint-700);text-transform:uppercase}
  .title{font-size:42px;font-weight:800;letter-spacing:-0.035em;line-height:1.1;margin:12px 0 14px;color:var(--gray-900)}
  .sub{font-size:15px;color:var(--gray-500);line-height:1.6}
  .features{display:flex;flex-direction:column;gap:8px;margin-top:32px}
  .feat{display:flex;gap:14px;padding:18px;border-radius:18px;background:transparent;cursor:pointer;border:1.5px solid transparent;transition:.16s}
  .feat:hover{background:var(--surface)}
  .feat.on{background:var(--surface);border-color:var(--mint-500);box-shadow:var(--shadow-sm)}
  .feat .num{width:30px;height:30px;border-radius:10px;background:var(--gray-100);color:var(--gray-500);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;transition:.16s}
  .feat.on .num{background:var(--mint-500);color:#fff}
  .feat .kicker-mini{font-size:11px;font-weight:700;color:var(--gray-400);letter-spacing:.02em;text-transform:uppercase}
  .feat.on .kicker-mini{color:var(--mint-700)}
  .feat .name{font-size:16px;font-weight:800;letter-spacing:-0.015em;margin-top:2px;color:var(--gray-900)}
  .feat .desc{font-size:13px;color:var(--gray-500);margin-top:4px;line-height:1.5}
  .hint{margin-top:24px;padding:12px 14px;border-radius:12px;background:var(--cream);color:var(--gray-600);font-size:12px;font-weight:600;border:1px solid var(--cream-2)}
  .right{flex:1;min-width:520px;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}

  /* Scene wraps device + character. Characters are absolutely positioned
     so they never participate in horizontal layout — fixes overlap with .left */
  .scene{position:relative;display:flex;align-items:flex-end;gap:24px}
  .scene.tablet-scene{align-items:center}
  .scene .bgWash{position:absolute;inset:-40px -80px;border-radius:48px;z-index:0;pointer-events:none}

  /* Phone — flatter shadow */
  .phone{width:376px;height:780px;border-radius:48px;background:#1a1a1a;padding:14px;box-shadow:0 24px 48px rgba(20,16,10,.10),0 4px 12px rgba(20,16,10,.06);position:relative;z-index:1}
  .screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--surface);position:relative}
  .notch{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:120px;height:30px;border-radius:18px;background:#000;z-index:10}
  .status{padding:16px 26px 8px;display:flex;justify-content:space-between;font-size:13px;font-weight:700}
  .content{height:calc(100% - 50px);overflow-y:auto;overflow-x:hidden}
  .content::-webkit-scrollbar{display:none}

  /* Tablet (landscape) — flatter shadow */
  .tablet{width:920px;height:660px;border-radius:28px;background:#1a1a1a;padding:14px;box-shadow:0 24px 48px rgba(20,16,10,.10),0 4px 12px rgba(20,16,10,.06);position:relative;z-index:1}
  .tabletScreen{width:100%;height:100%;border-radius:14px;overflow:hidden;background:var(--bg-soft);position:relative;display:flex}
  .tabletCam{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#333;z-index:10}

  /* Common — bigger type, flatter cards (Toss style) */
  .pageWrap{padding:20px 22px 100px}
  .h-kick{font-size:12px;font-weight:700;color:var(--mint-700);letter-spacing:.04em;text-transform:uppercase}
  .h-title{font-size:28px;font-weight:800;letter-spacing:-0.035em;line-height:1.15;margin-top:6px;color:var(--gray-900)}
  .card{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow-sm)}
  .btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gray-900);color:#fff;border:0;border-radius:16px;padding:18px 24px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;width:100%;letter-spacing:-0.01em;transition:.12s}
  .btn-primary:hover{background:var(--gray-700)}
  .btn-primary:active{transform:scale(.985)}
  .btn-mint{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--mint-500);color:#fff;border:0;border-radius:16px;padding:18px 24px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;width:100%;letter-spacing:-0.01em;transition:.12s}
  .btn-mint:hover{background:var(--mint-600)}
  .btn-ghost{background:var(--surface);color:var(--gray-700);border:1.5px solid var(--gray-200);border-radius:16px;padding:16px 22px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-ghost:hover{background:var(--gray-50);border-color:var(--gray-300)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700;background:var(--mint-50);color:var(--mint-700)}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 6px 14px}
  .iconbtn{width:40px;height:40px;border-radius:50%;background:var(--surface);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gray-700);transition:.12s}
  .iconbtn:hover{background:var(--gray-50)}
  .bgMint{background:linear-gradient(180deg,#EBF6F0 0%,var(--surface) 280px)}

  /* Characters removed — device + soft backdrop only */
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

  /* Scene backgrounds */
  .sceneBg.senior{background:radial-gradient(ellipse at 75% 60%, #E8F5EF 0%, #F1ECE2 60%);}
  .sceneBg.caregiver{background:radial-gradient(ellipse at 80% 50%, #E6EFFA 0%, #F1ECE2 60%);}
  .sceneBg.daughter{background:radial-gradient(ellipse at 20% 50%, #EFEAFB 0%, #F1ECE2 60%);}

  @media(max-width:1280px){
    .tablet{width:720px;height:520px}
  }
  @media(max-width:1100px){
    .left{position:static;flex:0 0 auto;width:100%;max-width:560px}
    .right{min-width:0;width:100%}
    .tablet{width:min(720px,92vw);height:auto;aspect-ratio:920/660}
    .tablet .tabletScreen{height:auto;aspect-ratio:920/660}
  }
</style>
</head>
<body>

<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState} = React;

const Ico = {
  Back: (p)=><svg width={p.s||20} height={p.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6"/></svg>,
  X: (p)=><svg width={p.s||20} height={p.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>,
  Play: (p)=><svg width={p.s||16} height={p.s||16} viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5z"/></svg>,
  Mic: (p)=><svg width={p.s||16} height={p.s||16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>,
  Star: (p)=><svg width={p.s||16} height={p.s||16} viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1 3-7z"/></svg>,
  Plus: (p)=><svg width={p.s||16} height={p.s||16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>,
  Check: (p)=><svg width={p.s||16} height={p.s||16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5 9-11"/></svg>,
  Doc: (p)=><svg width={p.s||16} height={p.s||16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>,
  Family: (p)=><svg width={p.s||16} height={p.s||16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="7" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M16 21v-1a3 3 0 0 1 3-3h1"/></svg>,
  Camera: (p)=><svg width={p.s||16} height={p.s||16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>,
  Phone: (p)=><svg width={p.s||16} height={p.s||16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>,
};

// ───── FEATURE 1 · AI 활동 추천 (시니어) ─────
function Flow_AI({onDone}){
  const [step,setStep] = useState(0);
  const screen = ['home','activity','result'][step];

  if(screen==='home') return (
    <div className="bgMint" style={{minHeight:'100%'}}>
      <div className="pageWrap">
        <div className="topbar">
          <div>
            <div className="h-kick">5월 11일 월요일</div>
            <div className="h-title">안녕하세요,<br/><span style={{color:'var(--mint-700)'}}>한영희</span>님</div>
          </div>
          <button className="iconbtn"><span style={{fontSize:18,fontWeight:900}}>≡</span></button>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10,background:'#fff',padding:'10px 14px',borderRadius:14,boxShadow:'var(--shadow-sm)'}}>
          <div style={{width:36,height:36,borderRadius:12,background:'var(--mint-500)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}><Ico.Star/></div>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:800}}>Pro 등급 80%</div>
            <div style={{fontSize:11,color:'var(--gray-500)'}}>이번주 활동 4 / 5회</div>
          </div>
          <div style={{width:60,height:6,background:'var(--mint-50)',borderRadius:99}}>
            <div style={{width:'80%',height:'100%',background:'var(--mint-500)',borderRadius:99}}/>
          </div>
        </div>
        <div style={{marginTop:18}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
            <span className="pill">✨ AI 맞춤 추천</span>
            <span style={{fontSize:11,color:'var(--gray-500)',fontWeight:600}}>어제 활동 기반</span>
          </div>
          <button onClick={()=>setStep(1)} style={{width:'100%',textAlign:'left',padding:0,border:0,background:'transparent',cursor:'pointer',fontFamily:'inherit'}}>
            <div style={{borderRadius:22,overflow:'hidden',background:'linear-gradient(160deg,#F8EFD9 0%,#F2E1B8 100%)',padding:'22px 20px 20px'}}>
              <div style={{fontSize:11,fontWeight:700,color:'#8C6F3F',letterSpacing:'.04em',textTransform:'uppercase'}}>오늘의 활동</div>
              <div style={{fontSize:26,fontWeight:800,letterSpacing:'-0.035em',lineHeight:1.15,marginTop:8,color:'#2D2110'}}>하루 10분<br/>가벼운 손가락 체조</div>
              <div style={{display:'flex',gap:6,marginTop:14}}>
                {['소근육','인지','10분'].map(t=><span key={t} style={{padding:'5px 12px',borderRadius:999,background:'rgba(255,255,255,.6)',fontSize:11,fontWeight:700,color:'#8C6F3F'}}>{t}</span>)}
              </div>
              <div style={{marginTop:18,padding:'16px 18px',background:'var(--gray-900)',color:'#fff',borderRadius:14,fontSize:15,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
                <Ico.Play s={14}/> 시작하기
              </div>
            </div>
          </button>
        </div>
        {/* 오늘 일정 */}
        <div className="card" style={{marginTop:12}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <div style={{fontSize:13,fontWeight:800,letterSpacing:'-0.01em'}}>오늘 일정</div>
            <span style={{fontSize:11,color:'var(--mint-700)',fontWeight:700}}>2 / 4 완료</span>
          </div>
          {[
            ['09:30','약 복용 · 혈압약','done'],
            ['10:15','손가락 체조 (AI 추천)','now'],
            ['12:00','점심 식사',''],
            ['15:00','복지관 산책',''],
          ].map(([t,n,s],i)=>(
            <div key={i} style={{display:'flex',gap:10,alignItems:'center',padding:'8px 0',borderTop:i?'1px solid #F0EDE3':'none'}}>
              <div style={{width:8,height:8,borderRadius:'50%',background:s==='done'?'var(--mint-500)':s==='now'?'#F5B043':'#E0DDD3'}}/>
              <div style={{minWidth:46,fontSize:11,fontWeight:800,color:'var(--gray-500)'}}>{t}</div>
              <div style={{flex:1,fontSize:13,fontWeight:s==='now'?800:700,color:s==='done'?'var(--gray-400)':'var(--gray-900)',textDecoration:s==='done'?'line-through':'none'}}>{n}</div>
              {s==='now'&&<span style={{fontSize:10,padding:'2px 8px',background:'#FFF3DA',color:'#8C6F3F',borderRadius:99,fontWeight:800}}>곧</span>}
            </div>
          ))}
        </div>

        {/* 딸 지수 메세지 */}
        <div style={{marginTop:12,padding:14,borderRadius:18,background:'linear-gradient(135deg,#F5C9A6,#FBE3CD)',color:'#3D2F18'}}>
          <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
            <div style={{width:36,height:36,borderRadius:'50%',background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>👧</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:'flex',gap:6,alignItems:'center'}}>
                <span style={{fontSize:12,fontWeight:800,color:'#7A5630'}}>딸 지수</span>
                <span style={{fontSize:10,color:'#A88458',fontWeight:700}}>· 10분 전</span>
              </div>
              <div style={{fontSize:13,fontWeight:700,marginTop:6,lineHeight:1.5,color:'#3D2F18'}}>"엄마 오늘 날씨도 좋은데 산책 다녀오세요 :) 주말에 볼게요!"</div>
            </div>
          </div>
          <button style={{marginTop:10,width:'100%',padding:'10px',background:'#fff',color:'#8C6F3F',border:0,borderRadius:12,fontWeight:800,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>답장하기</button>
        </div>

        {/* 건강수업 */}
        <div style={{marginTop:12}} className="card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{fontSize:11,fontWeight:800,color:'var(--mint-700)'}}>건강수업 · 음성</div>
            <span style={{fontSize:11,fontWeight:800,color:'var(--mint-600)'}}>▶ 3분</span>
          </div>
          <div style={{fontSize:16,fontWeight:800,marginTop:4,letterSpacing:'-0.02em'}}>치매의 다양한 원인</div>
          <div style={{fontSize:12,color:'var(--gray-500)',marginTop:4}}>오늘 4명의 어르신이 듣고 있어요</div>
        </div>

        {/* 이번주 활동 */}
        <div className="card" style={{marginTop:12}}>
          <div style={{fontSize:13,fontWeight:800,letterSpacing:'-0.01em',marginBottom:8}}>이번주 활동</div>
          <div style={{display:'flex',gap:6,alignItems:'flex-end',height:60}}>
            {['월','화','수','목','금','토','일'].map((d,i)=>{
              const h=[60,80,40,90,75,0,0][i];
              const done=i<5;
              return <div key={d} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
                <div style={{width:'70%',height:done?h+'%':4,background:done?(i===4?'var(--mint-600)':'var(--mint-300)'):'#E0DDD3',borderRadius:4,minHeight:4}}/>
                <div style={{fontSize:9,color:i===4?'var(--mint-700)':'var(--gray-500)',fontWeight:i===4?800:700}}>{d}</div>
              </div>
            })}
          </div>
          <div style={{marginTop:8,fontSize:11,color:'var(--gray-500)',display:'flex',justifyContent:'space-between'}}>
            <span>오늘 <b style={{color:'var(--mint-700)'}}>3건</b> 완료</span>
            <span>이번주 14건</span>
          </div>
        </div>

        {/* 응급 호출 */}
        <button style={{marginTop:12,width:'100%',padding:'12px',background:'#FBEAEA',color:'#C44',border:0,borderRadius:14,fontSize:13,fontWeight:800,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
          🆘 도움이 필요해요
        </button>
      </div>
    </div>
  );

  if(screen==='activity') return (
    <div style={{minHeight:'100%',background:'#F7FAF8'}}>
      <div style={{padding:'14px 18px 0',display:'flex',justifyContent:'space-between'}}>
        <button onClick={()=>setStep(0)} className="iconbtn"><Ico.Back/></button>
        <button onClick={onDone} className="iconbtn"><Ico.X/></button>
      </div>
      <div style={{padding:'8px 24px'}}>

          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',gap:6,alignItems:'center'}}>

        </button>
      </div>

      {/* Weekly summary */}
      <div style={{marginTop:12,padding:'14px 16px',borderRadius:16,background:'linear-gradient(135deg,#FFF7E6,#FBF0D8)'}}>

          <div style={{fontSize:12,fontWeight:800,color:'#8C6F3F'}}>이번주 요약</div>

          {[['활동','14건'],['수면','평균 7.1h'],['기분','😄 5일']].map(([l,v])=>(
            <div key={l} style={{flex:1,padding:'8px',background:'#fff',borderRadius:10,textAlign:'center'}}>
              <div style={{fontSize:14,fontWeight:800,color:'#5A4A36',letterSpacing:'-0.01em'}}>{v}</div>
              <div style={{fontSize:10,color:'var(--gray-500)',marginTop:2}}>{l}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );

  if(step===1) return (
    <div style={{minHeight:'100%',background:'#F7FAF8'}}>
      <div style={{padding:'14px 18px 0',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <button onClick={()=>setStep(0)} className="iconbtn"><Ico.Back/></button>
        <div style={{fontSize:13,fontWeight:800}}>오늘 하루</div>
        <button onClick={onDone} className="iconbtn"><Ico.X/></button>
      </div>
      <div style={{padding:'8px 20px'}}>
        <div className="h-kick">2025년 5월 11일</div>
        <div className="h-title">어머님의 하루</div>
      </div>
      <div style={{padding:'14px 20px 80px'}}>
        {[
          ['08:00','기상','잘 일어나셨어요',true],
          ['09:30','아침 식사','평소 양 80%',true],
          ['10:15','손가락 체조','10분 완료 · 😄',true],
          ['11:00','건강수업','치매 예방 강의',true],
          ['12:30','점심 식사','다 드셨어요',true],
          ['14:00','산책','복지관 마당 15분',true],
          ['15:30','워크지','겨울 간식 맞추기',true],
          ['18:30','저녁 식사','진행 중',false],
        ].map(([t,name,desc,done],i,arr)=>(
          <div key={i} style={{display:'flex',gap:12,paddingBottom:14,borderLeft:i<arr.length-1?'2px solid #E8E3D4':'2px solid transparent',marginLeft:8,paddingLeft:16,position:'relative'}}>
            <div style={{position:'absolute',left:-7,top:0,width:12,height:12,borderRadius:'50%',background:done?'var(--mint-500)':'#fff',border:done?'0':'2px solid var(--mint-300)'}}/>
            <div style={{minWidth:50,fontSize:12,fontWeight:800,color:'var(--gray-500)'}}>{t}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:14,fontWeight:800,letterSpacing:'-0.01em'}}>{name}</div>
              <div style={{fontSize:12,color:'var(--gray-500)',marginTop:2}}>{desc}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  return (
    <div style={{minHeight:'100%',background:'#fff',display:'flex',flexDirection:'column'}}>
      <div style={{padding:'14px 18px 12px',display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:'1px solid #f0eee9'}}>
        <button onClick={()=>setStep(0)} className="iconbtn"><Ico.Back/></button>
        <div>
          <div style={{fontSize:13,fontWeight:800,textAlign:'center'}}>손고은 선생님</div>
          <div style={{fontSize:10,color:'var(--mint-600)',textAlign:'center',fontWeight:700}}>● 활동 중</div>
        </div>
        <button onClick={onDone} className="iconbtn"><Ico.X/></button>
      </div>
      <div style={{flex:1,padding:'18px 16px',display:'flex',flexDirection:'column',gap:10,background:'#FBFBF7'}}>
        <Bubble who="them" t="오늘 손가락 체조도 잘 하시고 점심도 다 드셨어요. 가족과 통화하셨다고 좋아하셨어요 😊"/>
        <Bubble who="me" t="감사합니다 선생님 😊 잘 챙겨주셔서 늘 마음이 놓여요"/>
        <Bubble who="them" t="별말씀을요. 다음주 가족 면회 예약은 수요일 오후로 잡아두었어요!"/>
      </div>

        <div style={{flex:1,padding:'10px 14px',background:'#F4F7FB',borderRadius:999,fontSize:13,color:'var(--gray-400)'}}>메시지 입력...</div>
        <button className="iconbtn" style={{background:'var(--mint-600)',color:'#fff'}}><Ico.Mic/></button>
      </div>
    </div>
  );
}
function Bubble({who,t}){
  const me=who==='me';
  return <div style={{display:'flex',justifyContent:me?'flex-end':'flex-start'}}>
    <div style={{maxWidth:'78%',padding:'10px 14px',borderRadius:me?'16px 16px 4px 16px':'16px 16px 16px 4px',background:me?'var(--mint-600)':'#fff',color:me?'#fff':'var(--gray-900)',fontSize:13,lineHeight:1.45,boxShadow:me?'none':'var(--shadow-sm)'}}>{t}</div>
  </div>
}

function App(){

  const features = [

  ];

  return <div className="stage">
    <div className="left">
      <div className="kicker">NEO Senior Suite · 시연</div>
      <div className="title">3가지 핵심 기능<br/>딥링크 데모</div>

      <div className="features">
        {features.map((f,i)=>(
          <div key={i} className={'feat'+(i===feat?' on':'')} onClick={()=>setFeat(i)}>
            <div className="num">{i+1}</div>
            <div>
              <div style={{fontSize:11,color:'var(--mint-700)',fontWeight:800}}>{f.kicker}</div>

              <div className="desc">{f.desc}</div>

      <div className="hint">💡 화면 안의 버튼·카드를 누르면 다음 화면으로 이동해요</div>
    </div>
    <div className="right">
      {feat===0 && <SceneSenior/>}
      {feat===1 && <SceneCaregiver/>}
      {feat===2 && <SceneDaughter/>}

  </div>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
